<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Oxygen&family=Caveat&family=Fredoka+One&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="style.css" />
    <title>Cobee The Junior Programmer</title>
  </head>

  <body>
    <header>
      <div class="header">
        <img class="header-icon" src="https://cobee-the-junior-programmer.netlify.app/assets/header-icon.png" alt="" />
        <h3 class="title"><a href="index.html">Cobee The Coder</a></h3>
        <nav>
          <a href="project.html">Project</a>
          <a href="contact.html">Contact</a>
          <a href="about.html">About Us</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="contact-container">
        <div class="ilustration">
          <img class="illustration-img" src="https://cobee-the-junior-programmer.netlify.app/assets/contact-illustration.png" alt="" width="800" />
        </div>
        <div class="contact">
          <img class="profile-contact-img" src="https://cobee-the-junior-programmer.netlify.app/assets/profile-contact.png" alt="" />
          <h1>Contact Me</h1>
          <p>Please feel free to contact me to ask anything you need.</p>
          <h4>Your Information</h4>
          <form autocomplete="off">
            <div class="form-container">
              <div class="input-container">
                <div class="icon"><i class="fas fa-user"></i></div>
                <div class="form-input">
                  <input class="input-item" type="text" name="name" id="name" placeholder=" " />
                  <label for="name" class="form-label">Name</label>
                </div>
              </div>
              <div class="input-container">
                <div class="icon"><i class="fas fa-map-marker-alt"></i></div>
                <div class="form-input">
                  <input class="input-item" type="text" name="city" id="city" placeholder=" " />
                  <label for="city" class="form-label">City</label>
                </div>
              </div>
              <div class="input-container">
                <div class="icon"><i class="far fa-envelope-open"></i></div>
                <div class="form-input">
                  <input class="input-item" type="text" name="email" id="email" placeholder=" " />
                  <label for="email" class="form-label">Email</label>
                </div>
              </div>
              <div class="textarea-container">
                <div class="icon"><i class="fas fa-comment"></i></div>
                <div class="form-textarea">
                  <textarea class="textarea" name="message" id="message" cols="52" rows="8" placeholder=" "></textarea>
                  <label for="message" class="form-label">Message</label>
                </div>
              </div>
            </div>
            <input type="submit" value="Submit" class="submit" />
          </form>
        </div>
      </div>

      <div class="modal-container">
        <div class="modal">
          <img src="https://cobee-the-junior-programmer.netlify.app/assets/rocket.png" alt="" />
          <h3>Message Sent</h3>
          <p>Thank you for submitting. We will reply it soon.</p>
        </div>
      </div>
    </main>

    <footer>
      <div class="main-footer">
        <h3 class="info-top">Cobee The Junior Programmer</h3>
        <div class="social-media">
          <i class="fab fa-instagram-square"></i>
          <i class="fab fa-twitter-square"></i>
          <i class="fab fa-facebook-square"></i>
          <i class="fas fa-envelope"></i>
        </div>
        <p class="info-center">Copyright &copy; 2021. Cobee. All rights reserved.</p>
      </div>
    </footer>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script src="script.js"></script>
  </body>
</html>
